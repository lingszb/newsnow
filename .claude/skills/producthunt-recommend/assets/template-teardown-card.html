<!doctype html>
<html lang="zh-CN" data-style="teardown">
<head>
  <meta charset="utf-8">
  <title>Product Hunt 产品拆解 · Social Card Set</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    /* =========================================================
       Teardown 拆解风 — Product Hunt Deck Seed (xhs 3:4 only)
       ---------------------------------------------------------
       小红书原生「产品拆解」版式:暖橙主色、圆角卡片、分节内容块,
       页面吃满、信息密度高。一个 HTML 里多个 .poster.xhs。
       页面由 scripts/build-deck.mjs 填充到正文 @POSTERS@ 标记处。
       ========================================================= */

    /* ---------- 1. Tokens ---------- */
    :root {
      --paper: #faf9f7;
      --ink: #1f1f1f;
      --muted: #8a857e;
      --line: #efe9e2;
      --card: #ffffff;
      --accent: #f97316;        /* 暖橙 */
      --accent-deep: #ea580c;
      --accent-soft: #fdf0e7;   /* 橙浅底 */
      --radius: 16px;
      --sans: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
    }

    /* ---------- 2. Reset & sheet ---------- */
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      font-family: var(--sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      padding: 64px 32px;
    }
    .sheet { display: flex; flex-direction: column; align-items: center; gap: 48px; }

    /* ---------- 3. Poster board ---------- */
    .poster {
      position: relative;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
    }
    .poster.xhs { width: 1080px; height: 1440px; }
    .poster figure { margin: 0; }
    .poster.xhs .content {
      position: relative;
      width: 100%; height: 100%;
      padding: 56px 64px 48px;
      display: flex;
      flex-direction: column;
      gap: 34px;
    }

    /* ---------- 4. 顶栏 ---------- */
    .td-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .td-top .left { display: flex; align-items: center; gap: 20px; }
    .td-brand-logo {
      width: 64px; height: 64px;
      display: flex; align-items: center; justify-content: center;
    }
    .td-brand-logo svg { display: block; }
    .td-brand-name { font-size: 28px; font-weight: 800; margin: 0; }
    .td-brand-meta { font-size: 20px; color: var(--muted); margin: 4px 0 0; }
    .td-rank {
      font-size: 30px; font-weight: 800; color: var(--accent-deep);
      white-space: nowrap;
    }

    /* ---------- 5. 产品头:logo + 名称 + 一句话 ---------- */
    .td-head { display: flex; align-items: center; gap: 28px; }
    .td-logo {
      flex: 0 0 132px;
      width: 132px; height: 132px;
      border-radius: 28px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
    }
    .td-logo img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .td-name { font-size: 62px; font-weight: 900; line-height: 1.15; letter-spacing: -.01em; margin: 0; }
    .td-tag { font-size: 28px; font-weight: 700; color: var(--accent-deep); margin: 10px 0 0; line-height: 1.4; }

    /* ---------- 6. 正文角色 ---------- */
    .td-intro { font-size: 28px; line-height: 1.7; margin: 0; }
    .td-body  { font-size: 25px; line-height: 1.65; margin: 0; }

    /* ---------- 7. 分节标题:左橙条 + 橙粗体 ---------- */
    .td-sec {
      display: flex; align-items: center; gap: 16px;
      font-size: 28px; font-weight: 800; color: var(--accent-deep);
      margin: 0 0 14px;
    }
    .td-sec::before {
      content: ""; width: 8px; height: 30px;
      background: var(--accent); border-radius: 4px;
    }

    /* ---------- 8. 双卡:适合谁用 / 啥时候用得上 ---------- */
    .td-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .td-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px;
    }
    .td-card .lbl { font-size: 22px; color: var(--muted); margin: 0 0 14px; }
    .td-card .txt { font-size: 28px; font-weight: 700; line-height: 1.5; margin: 0; }

    /* ---------- 9. 列表:橙箭头 + 粗引导 ---------- */
    .td-list { display: flex; flex-direction: column; gap: 14px; }
    .td-li { display: flex; gap: 16px; align-items: baseline; }
    .td-li::before {
      content: ""; flex: 0 0 12px;
      width: 0; height: 0;
      border-left: 12px solid var(--accent);
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      transform: translateY(2px);
    }
    .td-li p { font-size: 27px; line-height: 1.6; margin: 0; }
    .td-li b { font-weight: 800; }

    /* ---------- 10. 竞品对比块 ---------- */
    .td-vs {
      background: var(--accent-soft);
      border-left: 8px solid var(--accent);
      border-radius: 6px;
      padding: 28px 32px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .td-vs .td-li::before {
      border-left: 0; width: 14px; height: 14px;
      border-radius: 50%; background: var(--ink);
      transform: translateY(0);
      flex-basis: 14px;
    }

    /* ---------- 11. 总结块 ---------- */
    .td-sum {
      background: var(--accent-soft);
      border-radius: 20px;
      padding: 32px;
    }
    .td-sum .head {
      display: flex; align-items: center; gap: 12px;
      font-size: 28px; font-weight: 800; color: var(--accent-deep);
      margin: 0 0 12px;
    }
    .td-sum p.txt { font-size: 28px; line-height: 1.7; margin: 0; }

    /* ---------- 12. 目录 / 榜单行 ---------- */
    .td-rows { display: flex; flex-direction: column; }
    .td-row {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 24px;
      align-items: baseline;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }
    .td-row:first-child { padding-top: 0; }
    .td-row:last-child { border-bottom: 0; }
    .td-row .nb { font-family: var(--mono); font-size: 28px; font-weight: 600; color: var(--accent-deep); }
    .td-row .t { font-size: 28px; font-weight: 700; }
    .td-row .t .sub { display: block; font-size: 24px; font-weight: 400; color: var(--muted); margin-top: 6px; }
    .td-row .v { font-family: var(--mono); font-size: 26px; color: var(--ink); }

    /* ---------- 13. 封面大标题 ---------- */
    .td-title { font-size: 88px; font-weight: 900; line-height: 1.2; letter-spacing: -.01em; margin: 0; }
    .td-hook { font-size: 28px; line-height: 1.6; color: var(--ink); margin: 0; }

    /* ---------- 14. 底栏 ---------- */
    .td-foot {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 22px;
      color: var(--muted);
      display: flex; align-items: center; gap: 16px;
      flex-wrap: wrap;
    }
    .td-foot a { color: var(--accent-deep); text-decoration: none; font-weight: 700; }
    .td-foot .sep { color: var(--line); }
  </style>
</head>
<body>
  <main class="sheet">

    <!-- @POSTERS@ -->
    <!-- build-deck.mjs 在此注入封面 / 产品拆解页 / 总结页。
         每页一个 <section class="poster xhs" id="…">,合法 id:
         xhs-cover / xhs-<rank> / xhs-summary -->

  </main>
</body>
</html>

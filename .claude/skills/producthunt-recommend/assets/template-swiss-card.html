<!doctype html>
<html lang="zh-CN" data-accent="ikb">
<head>
  <meta charset="utf-8">
  <title>Product Hunt 推荐 · Social Card Set</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+SC:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    /* =========================================================
       Swiss International — Product Hunt Deck Seed (xhs 3:4 only)
       ---------------------------------------------------------
       一个 HTML 里含多个 3:4 小红书页:
         .poster.xhs  1080×1440

       Accent 切换 via <html data-accent="…">:
         ikb | lemon-yellow | lemon-green | safety-orange

       页面由 scripts/build-deck.mjs 填充到正文 @POSTERS@ 标记处。
       每页是一种排版配方:封面 / 产品页 / 总结页。
       硬规则:一套卡一个 accent;无圆角/阴影/渐变;卡填充互斥;
       "越大越细"(≥200px 用 weight 200)。
       ========================================================= */

    /* ---------- 1. Accent palettes (4 mutually exclusive) ---------- */
    :root,
    [data-accent="ikb"] {
      --paper: #fafaf8;
      --ink: #0a0a0a;
      --grey-1: #f0f0ee;
      --grey-2: #d4d4d2;
      --grey-3: #737373;
      --accent: #002FA7;
      --accent-on: #ffffff;
    }
    [data-accent="lemon-yellow"] {
      --paper: #fafaf8;
      --ink: #0a0a0a;
      --grey-1: #f0f0ee;
      --grey-2: #d4d4d2;
      --grey-3: #737373;
      --accent: #FFD500;
      --accent-on: #0a0a0a;
    }
    [data-accent="lemon-green"] {
      --paper: #fafaf8;
      --ink: #0a0a0a;
      --grey-1: #f0f0ee;
      --grey-2: #d4d4d2;
      --grey-3: #737373;
      --accent: #C5E803;
      --accent-on: #0a0a0a;
    }
    [data-accent="safety-orange"] {
      --paper: #fafaf8;
      --ink: #0a0a0a;
      --grey-1: #f0f0ee;
      --grey-2: #d4d4d2;
      --grey-3: #737373;
      --accent: #FF6B35;
      --accent-on: #ffffff;
    }

    /* ---------- 2. Typography stack ---------- */
    :root {
      --sans:    "Inter", "Helvetica Neue", Helvetica, "Noto Sans SC",
                 -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif;
      --sans-zh: "Noto Sans SC", -apple-system, "PingFang SC",
                 "Microsoft YaHei UI", "Inter", sans-serif;
      --mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
    }

    /* ---------- 3. Spacing tokens (Carbon 2x scale) ---------- */
    :root {
      --sp-3:   8px;
      --sp-4:  12px;
      --sp-5:  16px;
      --sp-6:  24px;
      --sp-7:  32px;
      --sp-8:  40px;
      --sp-9:  48px;
      --sp-10: 64px;
      --sp-11: 80px;
      --sp-12: 96px;
    }

    /* ---------- 4. Reset & sheet ---------- */
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      font-family: var(--sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 64px 32px;
    }
    .sheet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    /* ---------- 5. Poster board (fixed export size) ---------- */
    .poster {
      position: relative;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
      isolation: isolate;
    }
    .poster.xhs    { width: 1080px; height: 1440px; }
    .poster figure { margin: 0; }
    .poster.xhs .content { padding: 56px var(--sp-11) 96px; }
    .content { position: relative; width: 100%; height: 100%; z-index: 2; }

    /* Optional decorative layers — opt in per poster */
    .dot-mat,
    .ring-mat,
    .cross-mat {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .dot-mat {
      opacity: .08;
      background-image: radial-gradient(var(--ink) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    .ring-mat {
      opacity: .08;
      background-image: radial-gradient(circle at 50% 50%, transparent 4px, var(--ink) 4.5px, var(--ink) 5px, transparent 5.5px);
      background-size: 32px 32px;
    }
    .cross-mat {
      opacity: .06;
      background-image:
        linear-gradient(var(--ink), var(--ink)),
        linear-gradient(90deg, var(--ink), var(--ink));
      background-size: 1px 14px, 14px 1px;
      background-position: center, center;
      background-repeat: repeat;
    }

    /* ---------- 6. Typography roles (Swiss extreme contrast) ----------
       硬规则:越大越细。≥200px → weight 200;小字反而更重(≥500)。 */
    .h-hero {
      font-family: var(--sans);
      font-weight: 200;
      font-size: 240px;
      line-height: 1.02;
      letter-spacing: -.02em;
      margin: 0;
      color: var(--ink);
    }
    .h-statement {
      font-family: var(--sans);
      font-weight: 200;
      font-size: 180px;
      line-height: 1.05;
      letter-spacing: -.015em;
      margin: 0;
      color: var(--ink);
    }
    .h-xl {
      font-family: var(--sans);
      font-weight: 300;
      font-size: 120px;
      line-height: 1.08;
      letter-spacing: -.01em;
      margin: 0 0 20px;
      color: var(--ink);
    }
    .h-md {
      font-family: var(--sans);
      font-weight: 400;
      font-size: 56px;
      line-height: 1.18;
      margin: 0;
      color: var(--ink);
    }
    .lead {
      font-family: var(--sans-zh);
      font-weight: 400;
      font-size: 30px;
      line-height: 1.55;
      color: var(--ink);
      margin: 0;
    }
    .body {
      font-family: var(--sans-zh);
      font-weight: 400;
      font-size: 26px;
      line-height: 1.6;
      color: var(--ink);
      margin: 0;
    }
    .t-cat {
      font-family: var(--sans);
      font-weight: 600;
      font-size: 22px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0;
    }
    .t-meta {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 20px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--grey-3);
      margin: 0;
    }
    .num-mega {
      font-family: var(--sans);
      font-weight: 200;
      font-size: 200px;
      line-height: .92;
      letter-spacing: -.03em;
      color: var(--ink);
      margin: 0;
    }
    .num-xl {
      font-family: var(--sans);
      font-weight: 200;
      font-size: 144px;
      line-height: .96;
      letter-spacing: -.02em;
      margin: 0;
    }
    .mono { font-family: var(--mono); }

    /* xhs 3:4:1080×1440 竖向预算最紧,展示字号下探(vs .wide 默认)。
       这些上限经 smoke 校验:2 行 h-xl @96px 才放得下矩阵/统计行。 */
    .poster.xhs .h-hero      { font-size: 168px; }
    .poster.xhs .h-statement { font-size: 124px; }
    .poster.xhs .h-xl        { font-size: 96px; }
    .poster.xhs .num-mega    { font-size: 168px; }
    .poster.xhs .num-xl      { font-size: 120px; }

    /* ---------- 7. Layout primitives ---------- */
    .stack    { display: flex; flex-direction: column; }
    .row      { display: flex; flex-direction: row; }
    .gap-3    { gap: var(--sp-3); }
    .gap-4    { gap: var(--sp-4); }
    .gap-5    { gap: var(--sp-5); }
    .gap-6    { gap: var(--sp-6); }
    .gap-7    { gap: var(--sp-7); }
    .gap-8    { gap: var(--sp-8); }
    .gap-9    { gap: var(--sp-9); }
    .gap-10   { gap: var(--sp-10); }
    .grow     { flex: 1; }
    .grid-12  { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--sp-7); }
    .grid-2   { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-9); }
    .grid-3   { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-7); }
    .grid-4   { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-6); }
    .span-2   { grid-column: span 2; }
    .span-3   { grid-column: span 3; }
    .span-6   { grid-column: span 6; }
    .span-12  { grid-column: span 12; }
    .center   { text-align: center; }
    .right    { text-align: right; }
    .uppercase{ text-transform: uppercase; }
    .hr-hairline {
      height: 1px;
      background: var(--grey-2);
      border: 0;
      margin: 0;
    }
    .hr-accent {
      height: 3px;
      background: var(--accent);
      border: 0;
      width: 96px;
      margin: 0;
    }

    /* ---------- 8. Card fills (mutually exclusive — pick ONE) ----------
       硬规则:同一节点绝不叠加 card-ink/card-accent/card-fill/card-outlined;
       多卡网格必须用同一类。 */
    .card-ink {
      background: var(--ink);
      color: var(--paper);
      padding: var(--sp-8);
    }
    .card-ink .t-cat,
    .card-ink .t-meta,
    .card-ink .lead,
    .card-ink .body,
    .card-ink .h-md { color: var(--paper); }
    .card-accent {
      background: var(--accent);
      color: var(--accent-on);
      padding: var(--sp-8);
    }
    .card-accent .t-cat,
    .card-accent .t-meta,
    .card-accent .lead,
    .card-accent .body,
    .card-accent .h-md { color: var(--accent-on); }
    .card-fill {
      background: var(--grey-1);
      color: var(--ink);
      padding: var(--sp-8);
    }
    .card-outlined {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--grey-2);
      padding: var(--sp-8);
    }

    /* ---------- 9. Frame containers (image holders) ---------- */
    .frame-img {
      position: relative;
      overflow: hidden;
      background: var(--grey-1);
      display: block;
      margin: 0;
    }
    .frame-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 50%;
      display: block;
    }
    .frame-img.fit-contain img { object-fit: contain; background: var(--paper); }
    .frame-img.r-3x4   { aspect-ratio: 3 / 4; }
    .frame-img.r-1x1   { aspect-ratio: 1 / 1; }
    .frame-img.r-4x3   { aspect-ratio: 4 / 3; }
    .frame-img.r-16x9  { aspect-ratio: 16 / 9; }
    .frame-img.r-16x10 { aspect-ratio: 16 / 10; }
    .swiss-img-caption {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 18px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--grey-3);
      margin-top: var(--sp-5);
    }

    /* ---------- 9b. Screenshot treatment (.frame-shot) ---------- */
    .frame-shot {
      position: relative;
      overflow: hidden;
      display: block;
      margin: 0;
      background: var(--grey-1);
      border-radius: 0;
    }
    .frame-shot.corners-sq { border-radius: 0; }
    .frame-shot.corners-sm { border-radius: 4px; }
    .frame-shot.shadow-soft { box-shadow: 0 12px 28px -16px rgba(0,0,0,.18); }
    .frame-shot.bg-paper    { background: var(--paper); }
    .frame-shot.bg-grey-1   { background: var(--grey-1); }
    .frame-shot.bg-ink      { background: var(--ink); }
    .frame-shot.bg-grid     {
      background-color: var(--paper);
      background-image:
        linear-gradient(to right, var(--grey-2) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grey-2) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .frame-shot.bg-dot {
      background-color: var(--paper);
      background-image: radial-gradient(var(--grey-2) 1px, transparent 1px);
      background-size: 18px 18px;
    }
    .frame-shot.inset-none > img { padding: 0; }
    .frame-shot.inset-sub  { padding: 20px; }
    .frame-shot.inset-bal  { padding: 48px; }
    .frame-shot.r-3x4   { aspect-ratio: 3 / 4; }
    .frame-shot.r-1x1   { aspect-ratio: 1 / 1; }
    .frame-shot.r-4x3   { aspect-ratio: 4 / 3; }
    .frame-shot.r-16x9  { aspect-ratio: 16 / 9; }
    .frame-shot.r-16x10 { aspect-ratio: 16 / 10; }
    .frame-shot > img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .frame-shot.fit-cover > img { object-fit: cover; }

    /* ---------- 10. Swiss components ---------- */

    /* 产品页:缩略图 hero + 统计行 */
    .image-hero {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: var(--sp-7);
      height: 100%;
    }
    .image-hero .hero-img-wrap {
      position: relative;
      overflow: hidden;
      background: var(--grey-1);
    }
    .image-hero .hero-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 50%;
      display: block;
    }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--sp-8);
      align-items: end;
      border-top: 1px solid var(--grey-2);
      padding-top: var(--sp-7);
    }
    .hero-stats .stat-block .num {
      font-family: var(--sans);
      font-weight: 200;
      font-size: 96px;
      line-height: 1;
      letter-spacing: -.02em;
      color: var(--ink);
      margin: 0 0 var(--sp-4);
    }
    .hero-stats .stat-block .lbl {
      font-family: var(--mono);
      font-size: 18px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--grey-3);
      margin: 0;
    }

    /* 总结页:KPI 塔 */
    .kpi-tower-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-7);
      align-items: end;
      height: 100%;
    }
    .kpi-tower-row .tower-col {
      display: flex;
      flex-direction: column;
      gap: var(--sp-5);
      align-items: flex-start;
    }
    .kpi-tower-row .tower-col .num {
      font-family: var(--sans);
      font-weight: 200;
      font-size: 112px;
      line-height: 1;
      letter-spacing: -.02em;
      margin: 0;
    }
    .kpi-tower-row .tower-col .lbl {
      font-family: var(--mono);
      font-size: 20px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--grey-3);
      margin: 0;
    }
    .kpi-tower-row .tower-col .bar-tower {
      width: 100%;
      height: var(--h, 200px);
      background: var(--accent);
    }
    .kpi-tower-row .tower-col.muted .bar-tower { background: var(--grey-2); }

    /* 横向条形图 */
    .h-bar-chart { display: grid; gap: var(--sp-6); }
    .h-bar-chart .bar-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--sp-4);
    }
    .h-bar-chart .bar-row .row-lbl {
      font-family: var(--sans-zh);
      font-weight: 500;
      font-size: 26px;
      color: var(--ink);
    }
    .h-bar-chart .bar-row .row-track {
      position: relative;
      height: 28px;
      background: var(--grey-1);
    }
    .h-bar-chart .bar-row .row-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: var(--w, 50%);
      background: var(--accent);
    }
    .h-bar-chart .bar-row .row-val {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 26px;
      letter-spacing: .04em;
      text-align: left;
      color: var(--ink);
    }

    /* 矩阵填充 */
    .matrix-fill {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: min-content;
      gap: var(--sp-4);
    }
    .matrix-fill .matrix-cell {
      background: var(--grey-1);
      padding: var(--sp-5);
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      min-height: 0;
    }
    .matrix-fill .matrix-cell .cell-nb {
      font-family: var(--mono);
      font-size: 18px;
      letter-spacing: .12em;
      color: var(--grey-3);
    }
    .matrix-fill .matrix-cell .cell-title {
      font-family: var(--sans-zh);
      font-weight: 500;
      font-size: 24px;
      line-height: 1.3;
      color: var(--ink);
    }
    .matrix-fill .matrix-cell.is-accent {
      background: var(--accent);
      color: var(--accent-on);
    }
    .matrix-fill .matrix-cell.is-accent .cell-nb,
    .matrix-fill .matrix-cell.is-accent .cell-title { color: var(--accent-on); }

    /* ---------- 11. Product Hunt 专用 ---------- */
    /* 产品页头部:logo 块 + 标题/卖点并排,不单独占一栏 */
    .ph-head {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: var(--sp-8);
      align-items: center;
    }
    .ph-head.no-logo { grid-template-columns: 1fr; }
    .ph-logo {
      width: 360px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--grey-1);
    }
    .ph-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .ph-head .h-xl { font-size: 104px; }
    /* 统计行:票数 / 评论 */
    .ph-stat {
      display: flex;
      gap: var(--sp-9);
      align-items: baseline;
      padding-top: var(--sp-6);
      border-top: 1px solid var(--grey-2);
    }
    .ph-stat .num {
      font-family: var(--sans);
      font-weight: 200;
      font-size: 88px;
      line-height: 1;
      letter-spacing: -.02em;
      color: var(--ink);
      margin: 0;
    }
    .ph-stat .lbl {
      font-family: var(--mono);
      font-size: 20px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--grey-3);
      margin: 0;
    }
    /* 目录 / 榜单行:封面本期看点、总结票数榜 */
    .ph-row {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: var(--sp-5) var(--sp-6);
      align-items: baseline;
      padding: var(--sp-5) 0;
      border-bottom: 1px solid var(--grey-2);
    }
    .ph-row:first-child { padding-top: 0; }
    .ph-row:last-child { border-bottom: 0; }
    .ph-row .row-nb {
      font-family: var(--mono);
      font-size: 24px;
      letter-spacing: .08em;
      color: var(--accent);
    }
    .ph-row .row-title {
      font-family: var(--sans-zh);
      font-weight: 500;
      font-size: 30px;
      line-height: 1.3;
      color: var(--ink);
    }
    .ph-row .row-title .sub {
      display: block;
      font-weight: 400;
      font-size: 22px;
      color: var(--grey-3);
      margin-top: var(--sp-3);
    }
    .ph-row .row-val {
      font-family: var(--mono);
      font-size: 24px;
      letter-spacing: .04em;
      color: var(--ink);
      text-align: right;
    }
    /* 底部链接行:查看产品(含可见链接) */
    .ph-link {
      display: flex;
      flex-direction: column;
      gap: var(--sp-4);
      margin-top: auto;
      padding-top: var(--sp-6);
      border-top: 1px solid var(--grey-2);
      font-family: var(--mono);
      text-decoration: none;
    }
    .ph-link .ph-link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-6);
      font-size: 20px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .ph-link .ph-url {
      font-size: 16px;
      letter-spacing: .04em;
      text-transform: none;
      color: var(--grey-3);
      word-break: break-all;
    }
    .ph-link .arrow { color: var(--accent); font-size: 28px; }
    .ph-link:hover .ph-link-row { color: var(--accent); }

    /* ---------- 12. Issue label + corner metadata ---------- */
    .chrome-min {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 18px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--grey-3);
      padding-bottom: var(--sp-6);
      border-bottom: 1px solid var(--grey-2);
      margin-bottom: var(--sp-6);
    }
  </style>
</head>
<body>
  <!-- ACCENT_OVERRIDE
       Change <html data-accent="…"> above to:
       ikb | lemon-yellow | lemon-green | safety-orange
       One deck — one accent. Never combine.
  -->
  <main class="sheet">

    <!-- @POSTERS@ -->
    <!-- build-deck.mjs 在此注入封面 / 产品页 / 总结页。
